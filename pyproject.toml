[project]
name = "quant-foundry"
version = "1.0.0"
description = "Adversarial algorithmic trading research laboratory (historical backtesting only, synthetic public data)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.5",
  "ruff==0.16.10",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantfoundry", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gate: hard release gate (Outcome Verification Loop runs these)",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "harness"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S311", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
